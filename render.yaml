# Configuración para publicar la tienda gratis en Render (https://render.com).
# Render la lee al crear un "Blueprint" desde este repositorio. Guía paso a paso: docs/PUBLICAR.md
services:
  - type: web
    # Tienda EMR ORIGINAL: el enlace será https://emr-original.onrender.com (si el nombre está libre).
    name: emr-original
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      # Cuenta del administrador. La contraseña la genera Render: la ves en tu servicio → Environment → ADMIN_PASSWORD.
      - key: ADMIN_EMAIL
        value: admin@emroriginal.pe
      - key: ADMIN_PASSWORD
        generateValue: true
      # Base de datos permanente (opcional). Sin estas dos variables la tienda usa un archivo que Render
      # borra cada vez que el servicio se reinicia. Agrégalas en Environment cuando tengas tu base de Turso.
